<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - ফুলঢলুয়া মানবসেবা সংগঠন</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7f5;color:#17352b}.top{background:#087f5b;color:#fff;padding:18px}.wrap{max-width:950px;margin:auto;padding:14px}.top .wrap{padding:0}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}h1{margin:0;font-size:24px}h2{margin-top:0}.field{margin:12px 0}label{display:block;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd8d3;border-radius:8px;font-size:16px}textarea{min-height:90px}button{border:0;border-radius:8px;padding:11px 16px;background:#087f5b;color:#fff;font-size:15px;cursor:pointer;margin:4px}button.gray{background:#667085}button.red{background:#c92a2a}.msg{padding:10px;border-radius:8px;background:#edf7f2;margin-top:10px}.hidden{display:none}.tabs{display:flex;gap:7px;flex-wrap:wrap}.item{border:1px solid #d8e2de;border-radius:10px;padding:12px;margin:8px 0}.small{font-size:13px;color:#667085}a{color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><div class="wrap"><h1>Admin Panel</h1><div>ফুলঢলুয়া মানবসেবা সংগঠন</div><div style="margin-top:8px"><a href="index.html">← সাইট দেখুন</a></div></div></header>
<main class="wrap">
<section id="loginBox" class="card">
<h2>🔐 Admin Login</h2><p class="small">ফোন নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>
<div class="field"><label>ফোন নম্বর</label><input id="phone" type="tel" inputmode="numeric" placeholder="017XXXXXXXX"></div>
<div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" placeholder="পাসওয়ার্ড"></div>
<button onclick="login()">লগইন</button><div id="loginMsg" class="msg"></div>
</section>
<section id="panel" class="hidden">
<div class="card"><h2>⚙️ Admin Dashboard</h2><div id="status" class="small">ডাটা লোড হচ্ছে...</div><button class="gray" onclick="logout()">লগআউট</button></div>
<div class="tabs"><button onclick="showTab('members')">সদস্য</button><button onclick="showTab('notices')">নোটিশ</button><button onclick="showTab('finance')">আয়-ব্যয়</button><button onclick="showTab('donation')">দান তথ্য</button></div>
<section id="members" class="card"><h2>👥 সদস্য যোগ/পরিবর্তন</h2><div class="row"><input id="mName" placeholder="সদস্যের নাম"><input id="mRole" placeholder="পদবি"><input id="mId" placeholder="সদস্য ID"><input id="mPhone" placeholder="ফোন নম্বর"><input id="mLocation" placeholder="ঠিকানা / এলাকা"><input id="mPhoto" placeholder="ছবির URL (ঐচ্ছিক)"></div><button onclick="addMember()">সদস্য যোগ করুন</button><div id="memberList"></div></section>
<section id="notices" class="card hidden"><h2>📢 নোটিশ</h2><input id="nTitle" placeholder="নোটিশের শিরোনাম"><textarea id="nText" placeholder="নোটিশের বিস্তারিত"></textarea><button onclick="addNotice()">নোটিশ যোগ করুন</button><div id="noticeList"></div></section>
<section id="finance" class="card hidden"><h2>💰 আয়-ব্যয়</h2><div class="row"><input id="income" type="number" placeholder="মোট আয়"><input id="expense" type="number" placeholder="মোট ব্যয়"></div><button onclick="saveFinance()">সংরক্ষণ করুন</button></section>
<section id="donation" class="card hidden"><h2>🤲 দান তথ্য</h2><div class="field"><input id="bkash" placeholder="বিকাশ নম্বর"></div><div class="field"><input id="nagad" placeholder="নগদ নম্বর"></div><div class="row"><input id="bankAccount" placeholder="ব্যাংক হিসাব নম্বর"><input id="bankExtra" placeholder="ব্যাংক/শাখা/অন্যান্য তথ্য"></div><button onclick="saveDonation()">সংরক্ষণ করুন</button></section>
</section></main>
<script>
const firebaseConfig={apiKey:"AIzaSyDAkFAP92SoWDxniN6y_qEUC_tO4enK8sY",authDomain:"fuldhalua-manav-seva-sangathan.firebaseapp.com",databaseURL:"https://fuldhalua-manav-seva-sangathan-default-rtdb.firebaseio.com",projectId:"fuldhalua-manav-seva-sangathan",storageBucket:"fuldhalua-manav-seva-sangathan.firebasestorage.app",messagingSenderId:"1045592949636",appId:"1:1045592949636:web:466a90775598db9f6b93d1"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let data={members:[],notices:[],finance:{income:0,expense:0},donation:{bkash:"",nagad:"",bankAccount:"",bankExtra:""}};
function adminEmail(p){p=(p||'').replace(/\D/g,'');return 'admin'+p+'@fuldhluya-manav-seva-sangathan.firebaseapp.com'}
function login(){const p=document.getElementById('phone').value.trim(),pw=document.getElementById('password').value;const msg=document.getElementById('loginMsg');if(!/^01\d{9}$/.test(p)){msg.textContent='সঠিক ১১ সংখ্যার ফোন নম্বর দিন।';return}if(!pw){msg.textContent='পাসওয়ার্ড দিন।';return}msg.textContent='লগইন হচ্ছে...';auth.signInWithEmailAndPassword(adminEmail(p),pw).then(()=>{msg.textContent=''}).catch(e=>{msg.textContent='লগইন হয়নি। ফোন নম্বর/পাসওয়ার্ড পরীক্ষা করুন।'})}
function logout(){auth.signOut()}
auth.onAuthStateChanged(user=>{document.getElementById('loginBox').classList.toggle('hidden',!!user);document.getElementById('panel').classList.toggle('hidden',!user);if(user)loadData()});
function showTab(id){['members','notices','finance','donation'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
async function loadData(){try{const s=await db.collection('appData').doc('main').get();if(s.exists)data={...data,...s.data()};render();document.getElementById('status').textContent='সংযুক্ত হয়েছে। ডাটা সংরক্ষণ করা যাবে।'}catch(e){document.getElementById('status').textContent='Firestore সংযোগ/Rules পরীক্ষা করুন।'}}
async function save(){await db.collection('appData').doc('main').set(data,{merge:true});render()}
async function addMember(){const m={name:mName.value.trim(),role:mRole.value.trim(),id:mId.value.trim(),phone:mPhone.value.trim(),location:mLocation.value.trim(),photo:mPhoto.value.trim()};if(!m.name){alert('সদস্যের নাম দিন');return}data.members=data.members||[];data.members.push(m);await save();[mName,mRole,mId,mPhone,mLocation,mPhoto].forEach(x=>x.value='')}
async function delMember(i){if(!confirm('এই সদস্য মুছবেন?'))return;data.members.splice(i,1);await save()}
async function addNotice(){if(!nTitle.value.trim())return;data.notices=data.notices||[];data.notices.push({title:nTitle.value.trim(),text:nText.value.trim(),date:new Date().toLocaleDateString('bn-BD')});await save();nTitle.value='';nText.value=''}
async function delNotice(i){if(!confirm('এই নোটিশ মুছবেন?'))return;data.notices.splice(i,1);await save()}
async function saveFinance(){data.finance={income:Number(income.value||0),expense:Number(expense.value||0)};await save();alert('আয়-ব্যয় সংরক্ষিত হয়েছে।')}
async function saveDonation(){data.donation={bkash:bkash.value.trim(),nagad:nagad.value.trim(),bankAccount:bankAccount.value.trim(),bankExtra:bankExtra.value.trim()};await save();alert('দান তথ্য সংরক্ষিত হয়েছে।')}
function render(){const ms=data.members||[];memberList.innerHTML=ms.map((m,i)=>`<div class="item"><b>${esc(m.name)}</b> — ${esc(m.role||'')}<br><span class="small">ID: ${esc(m.id||'')} | ফোন: ${esc(m.phone||'')} | ${esc(m.location||'')}</span><br><button class="red" onclick="delMember(${i})">মুছুন</button></div>`).join('')||'<p class="small">এখনো কোনো সদস্য নেই।</p>';const ns=data.notices||[];noticeList.innerHTML=ns.map((n,i)=>`<div class="item"><b>${esc(n.title)}</b><br>${esc(n.text)}<br><span class="small">${esc(n.date||'')}</span><br><button class="red" onclick="delNotice(${i})">মুছুন</button></div>`).join('')||'<p class="small">এখনো কোনো নোটিশ নেই।</p>';income.value=data.finance?.income||0;expense.value=data.finance?.expense||0;bkash.value=data.donation?.bkash||'';nagad.value=data.donation?.nagad||'';bankAccount.value=data.donation?.bankAccount||'';bankExtra.value=data.donation?.bankExtra||''}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
