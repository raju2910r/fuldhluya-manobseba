<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - ফুলঢলুয়া মানবসেবা সংগঠন</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#17352b}
.top{background:#087f5b;color:white;padding:18px}
.wrap{max-width:900px;margin:auto}
h1{margin:0;font-size:22px}
h2{margin-top:0}
.card{background:white;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 3px 14px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccd8d3;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:11px 16px;background:#087f5b;color:white;font-size:15px;cursor:pointer;margin:4px}
button.red{background:#c92a2a}
button.gray{background:#667085}
.msg{padding:10px;border-radius:8px;background:#edf7f2;margin-top:10px}
.hidden{display:none}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.item{border:1px solid #d8e2de;border-radius:10px;padding:12px;margin:8px 0}
.small{font-size:13px;color:#667085}
a{color:white}
</style>
</head>

<body>

<header class="top">
<div class="wrap">
<h1>Admin Panel</h1>
<div>ফুলঢলুয়া মানবসেবা সংগঠন</div>
<div style="margin-top:8px"><a href="index.html">← সাইট দেখুন</a></div>
</div>
</header>

<main class="wrap">

<!-- LOGIN -->
<section id="loginBox" class="card">
<h2>🔐 Admin Login</h2>
<p class="small">আপনার ফোন নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>

<label>ফোন নম্বর</label>
<input id="phone" type="tel" placeholder="017XXXXXXXX">

<label>পাসওয়ার্ড</label>
<input id="password" type="password" placeholder="পাসওয়ার্ড">

<button onclick="login()">লগইন</button>

<div id="loginMsg"></div>
</section>

<!-- ADMIN -->
<section id="panel" class="hidden">

<div class="card">
<h2>⚙️ Admin Dashboard</h2>
<div id="status" class="msg">ডাটা লোড হচ্ছে...</div>
<button class="gray" onclick="logout()">লগআউট</button>
</div>

<div class="card">
<h2>👥 সদস্য যোগ / পরিবর্তন</h2>

<input id="mName" placeholder="সদস্যের নাম">
<input id="mRole" placeholder="পদবি">
<input id="mId" placeholder="সদস্য ID">
<input id="mPhone" placeholder="ফোন নম্বর">
<input id="mLocation" placeholder="ঠিকানা / এলাকা">
<input id="mPhoto" placeholder="ছবির URL (ঐচ্ছিক)">

<button onclick="addMember()">সদস্য যোগ করুন</button>
