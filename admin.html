<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — ফুলঢলুয়া মানবসেবা সংগঠন</title>
<style>
:root{--g:#087f5b;--dark:#07382d;--bg:#f3f8f6;--card:#fff;--line:#d9e9e3;--red:#c92a2a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:#17352d}.wrap{max-width:1050px;margin:auto;padding:18px}.top{background:var(--dark);color:#fff;padding:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 25px #063c2e10;margin-bottom:16px}h1,h2,h3{margin-top:0}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 12px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.danger{background:#ffe3e3;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.hidden{display:none}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap;background:#e6f3ee;color:var(--dark)}.tabs button.active{background:var(--g);color:#fff}.small{color:#667a73;font-size:13px}.item{border-top:1px solid var(--line);padding:12px 0}.actions{display:flex;gap:7px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{color:#d7f5eb}.status{padding:8px 12px;border-radius:10px;background:#e9f7f1;color:var(--g);display:none;margin-bottom:12px}
</style></head><body><header class="top"><div class="wrap toprow"><div><h1>Admin Panel</h1><div>ফুলঢলুয়া মানবসেবা সংগঠন</div></div><a class="back" href="index.html">সাইট দেখুন →</a></div></header>
<main class="wrap">
<div id="login" class="card"><h2>🔐 Admin Login</h2><p class="small">শুধু Admin-এর জন্য। ফোন নম্বর ও পাসওয়ার্ড ব্যবহার করুন।</p><label>ফোন নম্বর</label><input id="phone" inputmode="tel" placeholder="01XXXXXXXXX"><label>পাসওয়ার্ড</label><input id="password" type="password" placeholder="পাসওয়ার্ড"><button class="primary" onclick="login()">লগইন</button><p id="loginMsg" class="small"></p></div>
<div id="panel" class="hidden"><div id="status" class="status"></div><div class="tabs"><button class="active" onclick="tab('members',this)">সদস্য</button><button onclick="tab('committee',this)">কমিটি</button><button onclick="tab('notices',this)">নোটিশ</button><button onclick="tab('activities',this)">কার্যক্রম</button><button onclick="tab('finance',this)">হিসাব</button><button onclick="tab('donation',this)">অনুদান</button><button onclick="logout()">লগআউট</button></div>
<section id="members" class="tab"><div class="card"><h2>সদস্য যোগ / সম্পাদনা</h2><input id="mName" placeholder="নাম"><input id="mRole" placeholder="পদ"><input id="mId" placeholder="সদস্য ID"><input id="mPhone" placeholder="ফোন"><input id="mLocation" placeholder="ঠিকানা / এলাকা"><input id="mPhoto" placeholder="ছবির URL (ঐচ্ছিক)"><input id="mIndex" type="hidden"><button class="primary" onclick="saveMember()">সংরক্ষণ</button> <button onclick="clearMember()">নতুন</button></div><div class="card"><h2>সদস্য তালিকা</h2><div id="memberList"></div></div></section>
<section id="committee" class="tab hidden"><div class="card"><h2>কমিটি সদস্য</h2><input id="cName" placeholder="নাম"><input id="cRole" placeholder="পদ"><input id="cIndex" type="hidden"><button class="primary" onclick="saveCommittee()">সংরক্ষণ</button> <button onclick="clearCommittee()">নতুন</button></div><div class="card"><div id="committeeList"></div></div></section>
<section id="notices" class="tab hidden"><div class="card"><h2>নোটিশ</h2><input id="nTitle" placeholder="শিরোনাম"><input id="nDate" type="date"><textarea id="nText" placeholder="বিস্তারিত"></textarea><input id="nIndex" type="hidden"><button class="primary" onclick="saveNotice()">সংরক্ষণ</button></div><div class="card"><div id="noticeList"></div></div></section>
<section id="activities" class="tab hidden"><div class="card"><h2>কার্যক্রম</h2><input id="aTitle" placeholder="শিরোনাম"><textarea id="aText" placeholder="বিস্তারিত"></textarea><input id="aIndex" type="hidden"><button class="primary" onclick="saveActivity()">সংরক্ষণ</button></div><div class="card"><div id="activityList"></div></div></section>
<section id="finance" class="tab hidden"><div class="card"><h2>আর্থিক হিসাব</h2><input id="income" type="number" placeholder="মোট আয়"><input id="expense" type="number" placeholder="মোট ব্যয়"><button class="primary" onclick="saveFinance()">সংরক্ষণ</button></div></section>
<section id="donation" class="tab hidden"><div class="card"><h2>অনুদান তথ্য</h2><input id="bkash" placeholder="বিকাশ নম্বর"><input id="nagad" placeholder="নগদ নম্বর"><input id="bankAccount" placeholder="ব্যাংক অ্যাকাউন্ট"><textarea id="bankExtra" placeholder="ব্যাংকের নাম, শাখা, অ্যাকাউন্টের নাম ইত্যাদি"></textarea><button class="primary" onclick="saveDonation()">সংরক্ষণ</button></div></section>
</div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDAfKAP92SoWDxniN6y_qEUC_tO4enK8sY",authDomain:"fuldhalua-manav-seva-sangathan.firebaseapp.com",projectId:"fuldhalua-manav-seva-sangathan",storageBucket:"fuldhalua-manav-seva-sangathan.firebasestorage.app",messagingSenderId:"1045592949636",appId:"1:1045592949636:web:466a90775598db9f6b93d1"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let data={members:[],committee:[],notices:[],activities:[],finance:{income:0,expense:0},donation:{}};let token=null;
async function login(){const p=phone.value.trim(),pw=password.value;loginMsg.textContent="লগইন যাচাই হচ্ছে...";try{const r=await fetch("YOUR_CLOUD_FUNCTION_URL/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:p,password:pw})});if(!r.ok)throw 0;const j=await r.json();token=j.token;localStorage.adminToken=token;showPanel()}catch(e){loginMsg.textContent="লগইন সার্ভার এখনো সংযুক্ত করা হয়নি। Cloud Function URL বসানোর পর এটি কাজ করবে।";}}
function showPanel(){login.classList.add("hidden");panel.classList.remove("hidden");load()}
function logout(){localStorage.removeItem("adminToken");location.reload()}
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function load(){db.collection("appData").doc("main").get().then(s=>{if(s.exists)data={...data,...s.data()};renderAll()})}
function save(){return db.collection("appData").doc("main").set(data,{merge:true}).then(()=>{status.textContent="সংরক্ষণ হয়েছে। পাবলিক সাইটে আপডেট হবে।";status.style.display="block";setTimeout(()=>status.style.display="none",2500)})}
function saveMember(){let i=mIndex.value;let o={name:mName.value,role:mRole.value,id:mId.value,phone:mPhone.value,location:mLocation.value,photo:mPhoto.value||"admin-photo.png"};if(i==="")data.members.push(o);else data.members[+i]=o;save().then(clearMember)}
function editMember(i){let m=data.members[i];["name","role","id","phone","location","photo"].forEach(k=>document.getElementById("m"+k[0].toUpperCase()+k.slice(1)).value=m[k]||"");mIndex.value=i;tab("members",document.querySelector(".tabs button"))}
function delMember(i){if(confirm("এই সদস্য মুছবেন?")){data.members.splice(i,1);save().then(renderAll)}}
function clearMember(){["mName","mRole","mId","mPhone","mLocation","mPhoto","mIndex"].forEach(id=>document.getElementById(id).value="")}
function saveCommittee(){let i=cIndex.value,o={name:cName.value,role:cRole.value};if(i==="")data.committee.push(o);else data.committee[+i]=o;save().then(clearCommittee)}
function clearCommittee(){cName.value=cRole.value=cIndex.value=""}
function delCommittee(i){if(confirm("মুছবেন?")){data.committee.splice(i,1);save().then(renderAll)}}
function saveNotice(){let i=nIndex.value,o={title:nTitle.value,date:nDate.value,text:nText.value};if(i==="")data.notices.push(o);else data.notices[+i]=o;save()}
function delNotice(i){data.notices.splice(i,1);save().then(renderAll)}
function saveActivity(){let i=aIndex.value,o={title:aTitle.value,text:aText.value};if(i==="")data.activities.push(o);else data.activities[+i]=o;save()}
function delActivity(i){data.activities.splice(i,1);save().then(renderAll)}
function saveFinance(){data.finance={income:Number(income.value||0),expense:Number(expense.value||0)};save()}
function saveDonation(){data.donation={bkash:bkash.value,nagad:nagad.value,bankAccount:bankAccount.value,bankExtra:bankExtra.value};save()}
function renderAll(){memberList.innerHTML=data.members.map((m,i)=>`<div class=item><b>${m.name}</b> — ${m.role||""}<div class=small>${m.id||""} · ${m.phone||""}</div><div class=actions><button onclick="editMember(${i})">Edit</button><button class=danger onclick="delMember(${i})">Delete</button></div></div>`).join("")||"<p class=small>কোনো সদস্য নেই।";committeeList.innerHTML=data.committee.map((m,i)=>`<div class=item><b>${m.name}</b> — ${m.role||""}<button class=danger onclick="delCommittee(${i})">Delete</button></div>`).join("")||"<p class=small>কোনো কমিটি তথ্য নেই।";noticeList.innerHTML=data.notices.map((n,i)=>`<div class=item><b>${n.title}</b><div>${n.text}</div><button class=danger onclick="delNotice(${i})">Delete</button></div>`).join("")||"<p class=small>কোনো নোটিশ নেই।";activityList.innerHTML=data.activities.map((a,i)=>`<div class=item><b>${a.title}</b><div>${a.text}</div><button class=danger onclick="delActivity(${i})">Delete</button></div>`).join("")||"<p class=small>কোনো কার্যক্রম নেই।";income.value=data.finance.income||0;expense.value=data.finance.expense||0;bkash.value=data.donation.bkash||"";nagad.value=data.donation.nagad||"";bankAccount.value=data.donation.bankAccount||"";bankExtra.value=data.donation.bankExtra||""}
if(localStorage.adminToken)showPanel();
</script></body></html>
